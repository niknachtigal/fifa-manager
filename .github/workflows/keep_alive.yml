name: Ping Streamlit App

on:
  schedule:
    # Roda a cada 1 hora
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping URL
        # Substitua a URL abaixo pelo link real do seu app
        run: curl -sL -w "%{http_code}\n" "https://campeonatos-fifa.streamlit.app/" -o /dev/null || true
